name: Linux
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Native dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxi-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev nftables iptables iproute2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dropship
      - run: cargo test --locked --manifest-path dropship/Cargo.toml
      - run: python3 -m unittest discover -s packaging/linux -p 'test_*.py'
      - name: Kernel firewall integration in isolated namespace
        # The runner's UID varies; keep its access to the checked-out workspace.
        run: |
          sudo unshare --net -- setpriv \
            --reuid="$(id -u)" --regid="$(id -g)" --clear-groups \
            --inh-caps=+net_admin --ambient-caps=+net_admin \
            python3 packaging/linux/test_firewall.py --integration
      - name: iptables IPv4/IPv6 kernel integration and backend migration
        run: |
          sudo unshare --net -- setpriv \
            --reuid="$(id -u)" --regid="$(id -g)" --clear-groups \
            --inh-caps=+net_admin --ambient-caps=+net_admin \
            env XTABLES_LOCKFILE="$RUNNER_TEMP/dropship-xtables.lock" \
            python3 packaging/linux/test_firewall.py --integration --backend iptables
      - run: cargo build --release --locked --manifest-path dropship/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: dropship-linux-x86_64
          path: |
            dropship/target/release/dropship
            packaging/linux/
            docs/linux.md
            LICENSE
